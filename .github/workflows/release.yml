name: Publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confirm the tag matches the tracked Windows release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version."
          }
          $installer = "builds/Plane-Pin-Setup-v$version.exe"
          $source = "builds/Plane-Pin-Source-v$version.zip"
          if (-not (Test-Path $installer) -or -not (Test-Path $source)) {
            throw "The versioned installer or source archive is missing."
          }
      - run: npm ci
      - run: npm test
      - name: Verify Linux keyring persistence across restarts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libglib2.0-bin xvfb
          dbus-run-session -- bash -euo pipefail -c '
            printf "plane-pin-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            gdbus introspect --session \
              --dest org.freedesktop.secrets \
              --object-path /org/freedesktop/secrets >/dev/null
            export PLANE_PIN_SAFE_STORAGE_FILE="$RUNNER_TEMP/plane-pin-safe-storage.bin"
            export PLANE_PIN_SAFE_STORAGE_USER_DATA="$RUNNER_TEMP/plane-pin-safe-storage-user-data"
            export PLANE_PIN_SAFE_STORAGE_PHASE=legacy-save
            xvfb-run --auto-servernum ./node_modules/.bin/electron scripts/safe-storage-smoke --no-sandbox
            export PLANE_PIN_SAFE_STORAGE_PHASE=migrate
            xvfb-run --auto-servernum ./node_modules/.bin/electron scripts/safe-storage-smoke --no-sandbox
            export PLANE_PIN_SAFE_STORAGE_PHASE=load
            xvfb-run --auto-servernum ./node_modules/.bin/electron scripts/safe-storage-smoke --no-sandbox
          '

  package:
    name: Package ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            script: "dist:mac"
          - platform: linux
            os: ubuntu-latest
            script: "dist:linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No Apple Developer certificate is available, so the macOS build ships
      # unsigned. README documents the Gatekeeper step that leaves for users.
      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name 'latest-*.yml' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: plane-pin-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true
      - name: Create the release with every platform's assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(Get-ChildItem builds -File | ForEach-Object FullName)
          $assets += @(Get-ChildItem downloaded -File -Recurse | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw "No release assets were found." }
          Write-Host "Attaching $($assets.Count) assets:"
          $assets | ForEach-Object { Write-Host "  $_" }
          ./scripts/get-release-notes.ps1 -Version $version | Set-Content release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --notes-file release-notes.md --title $env:GITHUB_REF_NAME
